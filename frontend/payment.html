<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservation Payment - The Grand Palate</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#10100f;color:#f2ead7;font-family:Jost,sans-serif}.payment-card{width:min(480px,100%);border:1px solid #383631;background:#181715;padding:42px;box-shadow:0 20px 70px #0008;text-align:center}.brand{color:#c9a84c;font:600 2rem 'Cormorant Garamond',serif}.eyebrow{margin-top:32px;color:#c9a84c;font-size:.72rem;letter-spacing:3px;text-transform:uppercase}h1{font:600 2.6rem 'Cormorant Garamond',serif;margin:8px 0}p{color:#aaa;line-height:1.6}.amount{color:#f2ead7;font-size:1.35rem;margin:25px}.pay-button{width:100%;padding:15px;border:0;background:#c9a84c;color:#111;cursor:pointer;font:500 .8rem Jost;letter-spacing:2px;text-transform:uppercase}.pay-button:disabled{opacity:.55;cursor:wait}.status{min-height:24px;color:#e98b8b}.back{display:inline-block;margin-top:20px;color:#c9a84c;text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<main class="payment-card">
  <a class="brand" href="index.html">The Grand Palate</a>
  <div class="eyebrow">Secure reservation deposit</div>
  <h1>Confirm your table</h1>
  <p>A refundable reservation deposit is required to continue.</p>
  <div class="amount">₹2.00</div>
  <button id="pay" class="pay-button" type="button">Pay securely</button>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <a class="back" href="reservation.html">Return to reservation</a>
</main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="payment.js"></script>
</body>
</html>
